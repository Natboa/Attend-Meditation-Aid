name: attend
description: "Attend — a mindfulness and meditation aid."
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Local persistence
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3

  # Audio
  just_audio: ^0.9.42
  audio_session: ^0.1.21

  # Notifications & scheduling
  flutter_local_notifications: ^18.0.1
  workmanager: ^0.9.0
  timezone: ^0.9.4

  # UI
  google_fonts: ^6.2.1

  # Utilities
  wakelock_plus: ^1.2.8
  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/logo/attend_circular_badge.jpg"
  adaptive_icon_background: "#F7F4EF"
  adaptive_icon_foreground: "assets/logo/attend_circular_badge.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/audio/
    - assets/logo/
