name: attend
description: "Attend — a mindfulness and meditation aid."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Local persistence
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3

  # Audio
  just_audio: ^0.9.42
  audio_session: ^0.1.21

  # Notifications & scheduling
  flutter_local_notifications: ^18.0.1
  workmanager: ^0.5.2
  timezone: ^0.9.4

  # UI
  google_fonts: ^6.2.1
  animations: ^2.0.11

  # Utilities
  wakelock_plus: ^1.2.8
  share_plus: ^10.0.3
  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/audio/
